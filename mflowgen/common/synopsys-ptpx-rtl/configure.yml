#=========================================================================
# Synopsys PTPX -- RTL
#=========================================================================

name: synopsys-ptpx-rtl

#-------------------------------------------------------------------------
# Inputs and Outputs
#-------------------------------------------------------------------------

inputs:
  - adk
  - design.vcs.v
  - design.spef.gz
  - design.pt.sdc
  - run.saif
  - design.namemap

outputs:
  - power.hier

#-------------------------------------------------------------------------
# Commands
#-------------------------------------------------------------------------

commands:
  # Genus writes the name map as Conformal LEC commands; PT needs Tcl.
  - python3 namemap_to_pt.py inputs/design.namemap namemap.pt.tcl
  - pt_shell -file pt_px.tcl
  # Surface the hierarchical power report as a named output, matching
  # synopsys-ptpx-gl/-synth so tile-post-rtl-power's run.sh can collect it.
  - mkdir -p outputs
  - cp reports/*.pwr.hier.rpt outputs/power.hier

#-------------------------------------------------------------------------
# Parameters
#-------------------------------------------------------------------------

parameters:
  clock_period: 1.0
  design_name: undefined
  strip_path: undefined
