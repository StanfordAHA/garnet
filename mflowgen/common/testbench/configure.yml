name: testbench

inputs:
  - run.vcd
  - tiles_Tile_MemCore.list
  - tiles_Tile_PE.list
  # From the application step: "{}" unless it used an app bundle, whose tile
  # scope/clock and per-design port lists then replace defines.py.
  - tile_ports.json
  - manifest.json

outputs:
  - cmd.tcl
  - testbench.sv
  - tile_tbs

commands:
  - ./run.sh

#-------------------------------------------------------------------------
# Parameters
#-------------------------------------------------------------------------

parameters:
  design_name: undefined
  clock_period: 1.0
  PWR_AWARE: True
