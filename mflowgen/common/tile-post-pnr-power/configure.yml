name: post-pnr-power

#-------------------------------------------------------------------------
# Inputs and Outputs
#-------------------------------------------------------------------------

inputs:
  - tiles_Tile_PE.list
  - tiles_Tile_MemCore.list
  - cmd.tcl
  - design.spef.gz
  - design.pt.sdc
  - design.sdf
  - design.vcs.v
  - design.vcs.pg.v
  - sram.v
  - sram-pwr.v
  - sram_tt.db
  - testbench.sv
  - tile_tbs

outputs:
  - reports

#-------------------------------------------------------------------------
# Commands
#-------------------------------------------------------------------------

commands:
  - mkdir outputs/reports
  - python run_all_tiles.py

#-------------------------------------------------------------------------
# Parameters
#-------------------------------------------------------------------------

parameters:
  # The parent graph's ADK; the per-tile sub-graph uses the same one.
  adk: ''
  adk_view: ''
  clock_period: 1.0
  design_name: undefined
  testbench_name: tb
  strip_path: tb/dut
  # Full-depth SHM waveforms of every replayed tile (GBs per tile at gate level;
  # nothing reads them, power comes from the SAIF). Env REPLAY_WAVES=True
  # turns them on to debug a replay.
  waves: False
  PWR_AWARE: True
  use_sdf: True
  # App bundle the tile stimulus came from (set by the tile graph); with one,
  # replay_check "auto" fails the step when a tile does not replay exactly.
  app_bundle: ""
  # auto | fail | warn (run_all_tiles.py). env REPLAY_CHECK via the tile graph.
  replay_check: auto
