#=========================================================================
# tile-post-rtl-power
#=========================================================================
# Per-tile RTL-activity power: RTL sim of each placed tile with the app's
# stimulus -> RTL SAIF -> synopsys-ptpx-rtl on the signed-off netlist (bound
# via the Genus design.namemap). Mirror of tile-post-pnr-power.

name: post-rtl-power

#-------------------------------------------------------------------------
# Inputs and Outputs
#-------------------------------------------------------------------------

inputs:
  - tiles_Tile_PE.list
  - tiles_Tile_MemCore.list
  - design.v          # RTL netlist (simulated to get RTL-name activity)
  - design.vcs.v      # signed-off gate netlist (power is computed on this)
  - design.spef.gz
  - design.pt.sdc
  - design.namemap    # Genus RTL->gate name map, `source`d by ptpx-rtl
  - sram.v
  - sram_tt.db
  - testbench.sv
  - tile_tbs

outputs:
  - reports

#-------------------------------------------------------------------------
# Commands
#-------------------------------------------------------------------------

commands:
  - mkdir outputs/reports
  - python run_all_tiles.py

#-------------------------------------------------------------------------
# Parameters
#-------------------------------------------------------------------------

parameters:
  clock_period: 1.0
  design_name: undefined
  testbench_name: tb
  strip_path: tb/dut
  waves: True
  PWR_AWARE: False
  use_sdf: False
